name = "hub-crm-api"
main = "hub-crm-api.js"
compatibility_date = "2026-08-03"

[[d1_databases]]
binding = "DB"
database_name = "hub-crm"
database_id = "fb4213e4-514c-400d-8a78-fb3cde28d066"

[vars]
CRM_PROVIDER = "freshsales"
FRESHSALES_DOMAIN = "nextpayllc"

[triggers]
# Polls Freshsales every 5 minutes for deals updated since the last run
# and mirrors stage changes into the hub (see scheduled() in hub-crm-api.js).
crons = ["*/5 * * * *"]

# trigger build
