name: Weekly Login Report

# Run every Friday at 9 AM EST
on:
  schedule:
    - cron: '0 14 * * FRI'  # 14:00 UTC = 9 AM EST
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekly Login Report
        run: |
          # This workflow will trigger a notification
          # Admins should then click "Email Report" on the admin dashboard
          # to send the login report to dom@nextpaypos.com and alexander@nextpaypos.com

          # Send notification email via webhook
          curl -X POST https://formspree.io/f/${{ secrets.FORMSPREE_FORM_ID }} \
            -H "Content-Type: application/json" \
            -d '{
              "email": "report-reminder@nextpaypos.com",
              "subject": "🔔 Sales Hub Weekly Report Reminder - ' $(date +%Y-%m-%d) '",
              "message": "Hi Admin,\n\nIt'\''s time to generate and send the weekly login report for the NextPay Sales Hub.\n\n**To send the report:**\n1. Go to https://hub.nextpaypos.com/admin.html\n2. Scroll to \"Weekly Login Report\" section\n3. Click \"📧 Email Report\" button\n4. Report will be sent to dom@nextpaypos.com and alexander@nextpaypos.com\n\nThe report shows all agents who logged in this week and their login frequency.\n\nThanks,\nNextPay Sales Hub"
            }'
        env:
          FORMSPREE_FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
