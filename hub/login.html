<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NextPay Sales Hub — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #0C1B2A 0%, #122536 100%);
      color: #16283A;
      font-size: 15px;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(12, 27, 42, 0.2);
      max-width: 420px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      justify-content: center;
    }
    .logo-box {
      background: #14A18C;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
    }
    .logo-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #14A18C;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #5B6B7B;
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
    }
    .google-signin {
      margin-bottom: 24px;
    }
    #g_id_onload {
      display: flex;
      justify-content: center;
    }
    .note {
      background: #F4F7FA;
      border-left: 4px solid #14A18C;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      font-size: 13px;
      color: #5B6B7B;
      margin-top: 24px;
    }
    .note b {
      color: #14A18C;
      font-weight: 700;
    }
    .error {
      background: rgba(214, 90, 90, 0.1);
      border-left: 4px solid #D65A5A;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      font-size: 13px;
      color: #D65A5A;
      margin-bottom: 24px;
      display: none;
    }
    .spinner {
      display: none;
      text-align: center;
      color: #14A18C;
      font-weight: 600;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-box">NP</div>
      <div class="logo-text">Sales Hub</div>
    </div>

    <h1>Welcome</h1>
    <p class="subtitle">Sign in with your NextPay email to continue</p>

    <div class="error" id="error-msg"></div>
    <div class="spinner" id="spinner">Verifying email...</div>

    <div class="google-signin" id="g_id_onload"
         data-client_id="YOUR_GOOGLE_CLIENT_ID"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div id="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular" data-logo_alignment="left"></div>

    <div class="note">
      <b>Only @nextpaypos.com email addresses</b> can access the Sales Hub. Sign in with your NextPay Google account.
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function handleCredentialResponse(response) {
      const spinner = document.getElementById('spinner');
      const errorMsg = document.getElementById('error-msg');

      spinner.style.display = 'block';
      errorMsg.style.display = 'none';

      // Decode the JWT to get user info
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      const userData = JSON.parse(jsonPayload);

      // Check if email is @nextpaypos.com
      if (!userData.email || !userData.email.endsWith('@nextpaypos.com')) {
        spinner.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent = '❌ Access denied. Only @nextpaypos.com email addresses are authorized.';
        return;
      }

      // Store authentication
      localStorage.setItem('hub_auth', JSON.stringify({
        email: userData.email,
        name: userData.name,
        picture: userData.picture,
        timestamp: new Date().getTime(),
        token: response.credential
      }));

      // Redirect to dashboard
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }

    // Check if already authenticated
    window.addEventListener('load', () => {
      const auth = localStorage.getItem('hub_auth');
      if (auth) {
        try {
          const data = JSON.parse(auth);
          // Check if token is still valid (within 1 hour)
          if (new Date().getTime() - data.timestamp < 3600000) {
            window.location.href = 'dashboard.html';
          } else {
            localStorage.removeItem('hub_auth');
          }
        } catch (e) {
          localStorage.removeItem('hub_auth');
        }
      }
    });
  </script>
</body>
</html>
